[project]
name = "rfid-reader-emulator"
version = "0.1.0"
description = "Emulated RFID reader serving an HTTP/XML API for bench testing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["defusedxml>=0.7.1"]

[project.scripts]
rfid-reader-emulator = "rfid_reader_emulator.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfid_reader_emulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S311"]  # seeded random is for reproducible fake data, not security

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
